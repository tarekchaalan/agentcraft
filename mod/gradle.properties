# Gradle daemon memory (decompiling Minecraft for genSources needs a few GB).
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Fabric Properties - see https://fabricmc.net/develop and mod/DEV.md for why these versions.
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18.2

# Mod Properties
mod_version=0.1.0
maven_group=dev.agentcraft
archives_base_name=agentcraft

# Dependencies
fabric_api_version=0.161.0+26.3
# DevBridge WebSocket server (bundled via jar-in-jar)
java_websocket_version=1.6.0
# Unit tests (mod/src/test/java)
junit_version=5.13.4
